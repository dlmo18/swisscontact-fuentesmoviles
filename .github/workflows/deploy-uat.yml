name: Deploy to Google Cloud (UAT)

on:
  pull_request:
    branches:
      - uat

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GCLOUD_SSH_KEY }}

      - name: Deploy with rsync over SSH
        run: |
          rsync -avz --no-times --delete \
            --exclude='.gitignore' \
            --exclude='composer.json' \
            --exclude='package.json' \
            --exclude='bs-config.js' \            
            -e "ssh -o StrictHostKeyChecking=no" \
            ./ \
            ${{ secrets.GCLOUD_USER }}@${{ secrets.GCLOUD_HOST }}:/var/www/programacalac.com/  